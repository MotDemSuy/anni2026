<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Preview — Lời Kết Album</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@400;500;600&family=Dancing+Script:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="experience is-playing">
      <div class="ambient-light" aria-hidden="true"></div>
      <div class="album-stage">
        <div class="album-shadow" aria-hidden="true"></div>
        <div class="album">
          <div class="album-spine" aria-hidden="true"></div>
          <section class="album-page album-page--heart-collage transition-memory-stack is-active">
            <div class="heart-layout">
              <div class="heart-collage-wrap">
                <div class="heart-collage" aria-label="Chín kỷ niệm tạo thành một trái tim">
                  <figure class="heart-photo heart-photo--1"><img src="images/child.jpg" alt="Kỷ niệm đầu tiên" /></figure>
                  <figure class="heart-photo heart-photo--2"><img src="images/2022.jpg" alt="Kỷ niệm năm 2022" /></figure>
                  <figure class="heart-photo heart-photo--3"><img src="images/2023.jpg" alt="Kỷ niệm năm 2023" /></figure>
                  <figure class="heart-photo heart-photo--4"><img src="images/2024.jpg" alt="Kỷ niệm năm 2024" /></figure>
                  <figure class="heart-photo heart-photo--5"><img src="images/2025.jpg" alt="Kỷ niệm năm 2025" /></figure>
                  <figure class="heart-photo heart-photo--6"><img src="images/2025.1.jpg" alt="Kỷ niệm năm 2025" /></figure>
                  <figure class="heart-photo heart-photo--7"><img src="images/2026.jpg" alt="Kỷ niệm năm 2026" /></figure>
                  <figure class="heart-photo heart-photo--8"><img src="images/2026.1.jpg" alt="Kỷ niệm năm 2026" /></figure>
                  <figure class="heart-photo heart-photo--9"><img src="images/2026.2.jpg" alt="Kỷ niệm năm 2026" /></figure>
                </div>
              </div>
              <div class="page-copy ending-copy">
                <p class="page-kicker ending-line ending-line--1">BỐN NĂM RỒI...</p>
                <h2 class="page-title ending-line ending-line--2">VÀ ANH VẪN MUỐN CÓ EM<br>TRONG NHỮNG CHƯƠNG TIẾP THEO.</h2>
                <p class="page-text ending-line ending-line--3">HẾT RỒI SAO?<br><em>MÌNH VIẾT TIẾP NHÉ...</em></p>
              </div>
            </div>
          </section>
        </div>
      </div>
      <div class="grain" aria-hidden="true"></div>
    </main>
  </body>
</html>
