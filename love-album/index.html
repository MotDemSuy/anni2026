<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#24211f" />
    <title>Cuốn Album Bốn Năm</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@400;500;600&family=Dancing+Script:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="experience" id="experience">
      <div class="ambient-light" aria-hidden="true"></div>
      <div class="album-stage" id="albumStage" aria-label="Cuốn Album Bốn Năm">
        <div class="album-shadow" aria-hidden="true"></div>
        <div class="album" id="album">
          <div class="album-spine" aria-hidden="true"></div>
          <div class="book-pages" id="bookPages"></div>
        </div>
      </div>

      <section class="cover" id="cover" role="dialog" aria-modal="true" aria-label="Màn hình mở đầu">
        <div class="cover-vignette"></div>
        <div class="start-only">
          <div class="cover-heart-wrap" aria-hidden="true"><span class="cover-date">24</span><span class="cover-heart">♥</span><span class="cover-date">9</span></div>
          <p class="cover-kicker">MỘT CUỐN ALBUM KỶ NIỆM</p>
          <h1 class="cover-title cover-names">
            <span class="cover-name">MẠNH KHA</span>
            <span class="cover-heart-beat" aria-hidden="true">♥</span>
            <span class="cover-name">HUYỀN TRANG</span>
          </h1>
          <p class="cover-song">♫ Sau Tất Cả Em Vẫn Ở Đây</p>
          <button id="startButton" type="button">Bắt đầu</button>
          <p class="cover-tip">Mở loa lên nhé 🎧 — album sẽ tự lật trang theo nhạc</p>
        </div>
      </section>
      <div class="grain" aria-hidden="true"></div>
    </main>
    <audio id="music" preload="metadata" src="music/Sau-Tat-Ca-Em-Van-O-Day.mp3"></audio>
    <script src="script.js"></script>
  </body>
</html>
