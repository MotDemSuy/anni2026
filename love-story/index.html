<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#211d1b" />
    <title>Bốn Năm — Câu Chuyện Nhỏ Của Chúng Mình</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="film" id="film" aria-label="Bốn Năm — our little story">
      <div class="grain" aria-hidden="true"></div>
      <div class="light-leak" aria-hidden="true"></div>
      <div class="scene-stage" id="sceneStage" aria-live="polite"></div>

      <section class="intro" id="intro" aria-label="Bắt đầu câu chuyện">
        <p class="eyebrow">MỘT THƯỚC PHIM CỦA CHÚNG MÌNH</p>
        <h1>BỐN NĂM</h1>
        <p class="intro-subtitle">câu chuyện nhỏ của chúng mình</p>
        <button class="start-button" id="startButton" type="button">
          <span>BẮT ĐẦU CÂU CHUYỆN</span><i aria-hidden="true">→</i>
        </button>
        <p class="start-note">hãy bật âm thanh để cảm nhận trọn vẹn</p>
      </section>

      <div class="topline">
        <span>2022 — 2026</span>
      </div>

    </main>

    <audio id="soundtrack" preload="metadata" src="music/final.mp3"></audio>
    <script src="script.js"></script>
  </body>
</html>
