<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#18120f" />
  <title>Bốn năm — Như những ngày đầu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&family=Great+Vibes&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet" />
  <style>
    :root { --gold: #ddb86d; --cream: #fff9ed; --ink: #473b32; --night: #15100e; --muted: #cdbfae; }
    * { box-sizing: border-box; }
    html { background: var(--night); }
    body { margin: 0; color: #fff; overflow: hidden; font-family: "Be Vietnam Pro", sans-serif; }
    button { font: inherit; }
    .screen { min-height: 100svh; position: relative; overflow: hidden; }

    /* Màn hình đĩa than */
    #musicScreen { display: grid; place-items: center; background: radial-gradient(circle at 50% 43%, #503624 0, #2c1d18 26%, #15100e 64%); isolation: isolate; transition: opacity 1.15s ease, transform 1.15s cubic-bezier(.5,0,.2,1); }
    #musicScreen::before, #musicScreen::after { content: ""; position: absolute; border-radius: 50%; pointer-events: none; z-index: -1; }
    #musicScreen::before { width: min(85vw, 900px); aspect-ratio: 1; border: 1px solid rgba(221,184,109,.15); box-shadow: 0 0 0 90px rgba(221,184,109,.025), 0 0 0 180px rgba(221,184,109,.018); }
    #musicScreen::after { inset: 0; opacity: .25; background-image: radial-gradient(rgba(255,255,255,.25) .6px, transparent .7px); background-size: 8px 8px; mix-blend-mode: soft-light; }
    .music-layout { width: min(1080px, 90vw); display: grid; grid-template-columns: minmax(280px, .9fr) minmax(300px, 1.1fr); align-items: center; gap: clamp(2rem, 7vw, 7rem); }
    .record-area { position: relative; display: grid; place-items: center; padding: 1rem; }
    .record-glow { position: absolute; width: 78%; aspect-ratio: 1; border-radius: 50%; background: var(--gold); filter: blur(64px); opacity: .22; }
    .vinyl { width: min(350px, 68vw); aspect-ratio: 1; position: relative; display: grid; place-items: center; border-radius: 50%; background: repeating-radial-gradient(circle, #0b0b0c 0 3px, #202023 4px 5px, #101012 6px 8px); box-shadow: 14px 18px 42px #0009, inset -9px -6px 18px #000, inset 10px 8px 20px #ffffff0b; animation: spin 11s linear infinite; }
    .vinyl::before { content: ""; position: absolute; inset: 7%; border-radius: inherit; border: 1px solid #fff1; background: conic-gradient(from 40deg, transparent, #ffffff13, transparent 25%, #ffffff08, transparent 50%); }
    .vinyl.is-paused { animation-play-state: paused; }
    .label { width: 36%; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; overflow: hidden; border: 3px solid #d6ae64; background: linear-gradient(135deg,#ad6e49,#563629); color: #fff9; text-align: center; font: 1rem/1.1 "Playfair Display", serif; }
    .label img { width: 100%; height: 100%; object-fit: cover; }
    .spindle { position: absolute; width: 11px; aspect-ratio: 1; border-radius: 50%; background: #d5c49f; box-shadow: 0 0 0 2px #806c4d; }
    .record-caption { margin-top: 1.65rem; font-size: .72rem; letter-spacing: .18em; text-align: center; text-transform: uppercase; color: var(--muted); }
    .words { border-left: 1px solid #ddb86d99; padding: .4rem 0 .4rem clamp(1.5rem, 4vw, 3.5rem); min-height: 300px; display: flex; flex-direction: column; justify-content: center; }
    .eyebrow { margin: 0 0 .6rem; color: var(--gold); font-size: .73rem; letter-spacing: .24em; text-transform: uppercase; }
    h1 { margin: 0 0 1.7rem; font: 500 clamp(2.5rem, 5vw, 4.5rem)/.95 "Great Vibes", cursive; color: #f5d48e; text-shadow: 0 3px 24px #c88e3066; }
    #lyricLine { margin: 0; min-height: 4em; color: #fff7e7; font: 500 clamp(1.1rem, 2vw, 1.45rem)/1.75 "Playfair Display", serif; transition: opacity .45s ease, transform .45s ease; }
    #lyricLine.changing { opacity: 0; transform: translateY(10px); }
    .track-progress { width: min(340px, 100%); height: 2px; margin-top: 2rem; overflow: hidden; background: #fff2; }
    .track-progress span { display: block; height: 100%; width: 0; background: var(--gold); transition: width .5s linear; }
    .controls { position: absolute; right: clamp(1.25rem, 4vw, 3rem); bottom: clamp(1.25rem, 4vw, 2.5rem); display: flex; align-items: center; gap: .8rem; }
    .music-toggle { border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: .75rem; font-size: .78rem; letter-spacing: .08em; }
    .next { border: 1px solid var(--gold); border-radius: 999px; padding: .78rem 1.3rem; color: #25180d; background: var(--gold); cursor: pointer; box-shadow: 0 8px 24px #0004; transition: transform .2s, box-shadow .2s, background .2s; }
    .next:hover { transform: translateY(-2px); background: #f2d18c; box-shadow: 0 12px 28px #0006; }

    /* Màn mở đầu: lời chúc + trái tim + nút mở nhạc */
    #introScreen { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; padding: 1.5rem; text-align: center; cursor: pointer; background: radial-gradient(circle at 50% 42%, #503624 0, #2c1d18 26%, #15100e 64%); transition: opacity 1.05s ease, transform 1.05s ease, visibility 0s linear 1.05s; }
    #introScreen::after { content: ""; position: absolute; inset: 0; opacity: .25; pointer-events: none; background-image: radial-gradient(rgba(255,255,255,.25) .6px, transparent .7px); background-size: 8px 8px; mix-blend-mode: soft-light; }
    .intro-box { position: relative; animation: introIn 1.1s ease both .15s; }
    @keyframes introIn { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: none; } }
    .intro-msg { margin: 0 0 2.4rem; font: 500 clamp(2.3rem, 8vw, 4rem)/1.3 "Great Vibes", cursive; color: #f5d48e; text-shadow: 0 3px 24px #c88e3066; }
    .intro-heart { display: inline-block; color: #e79aa4; transform: translateY(.05em); animation: heartBeat 1.5s ease-in-out infinite; }
    @keyframes heartBeat { 0%, 100% { transform: translateY(.05em) scale(1); } 25% { transform: translateY(.05em) scale(1.25); } 40% { transform: translateY(.05em) scale(.96); } }
    .intro-btn { display: inline-flex; align-items: center; gap: .65rem; border: 1px solid #ffe9c9aa; border-radius: 999px; padding: .95rem 1.8rem; color: #25180d; background: var(--gold); cursor: pointer; font-weight: 600; font-size: 1.02rem; box-shadow: 0 10px 28px #0005; transition: transform .2s, background .2s, box-shadow .2s; }
    .intro-btn:hover { transform: translateY(-2px); background: #f2d18c; box-shadow: 0 14px 32px #0006; }
    .intro-btn:active { transform: scale(.96); }
    .intro-note { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: #25180d22; font-size: 1.1rem; animation: notePulse 1.6s ease-in-out infinite; }
    @keyframes notePulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.18); } }
    .intro-hint { margin: 1.6rem 0 0; color: var(--muted); font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; }
    .intro-done #introScreen { opacity: 0; transform: scale(.96); visibility: hidden; pointer-events: none; }
    .next:focus-visible, .music-toggle:focus-visible, .back:focus-visible { outline: 2px solid white; outline-offset: 3px; }

    /* Lá thư */
    #letterScreen { position: fixed; inset: 0; z-index: 3; display: grid; place-items: center; padding: clamp(1rem, 4vw, 3rem); overflow: auto; opacity: 0; visibility: hidden; background: linear-gradient(135deg, #c8a66e, #816044); transition: opacity 1.15s ease, visibility 0s linear 1.15s; }
    #letterScreen::before { content: ""; position: fixed; inset: 0; opacity: .28; pointer-events: none; background-image: radial-gradient(#503b2b .65px, transparent .75px); background-size: 5px 5px; }
    .letter { width: min(750px, 100%); position: relative; margin: auto; max-height: calc(100svh - 2 * clamp(1rem, 4vw, 3rem)); overflow-y: auto; padding: clamp(1.6rem, 5vw, 3.2rem); color: var(--ink); background: var(--cream); box-shadow: 0 28px 70px #2b1d14aa; transform: translateY(45px) rotateX(7deg); opacity: 0; transition: transform 1.1s cubic-bezier(.2,.8,.2,1) .25s, opacity .8s ease .25s; }
    .letter::before { content:""; position:absolute; inset: 12px; border: 1px solid #b99051aa; pointer-events:none; }
    .letter > * { position: relative; }
    .letter-date { margin: 0 0 1.2rem; color: #8e6b3a; font-size: .75rem; letter-spacing: .16em; text-transform: uppercase; }
    .letter h2 { margin: 0 0 .9rem; font: 500 clamp(2.2rem, 5vw, 3.6rem)/1 "Great Vibes", cursive; color: #88612e; }
    @media (max-height: 620px) { .letter h2 { font-size: clamp(1.8rem, 7vh, 2.6rem); margin-bottom: .6rem; } .letter-date { margin-bottom: 1rem; } .signature { margin-top: 1.1rem; font-size: 1.7rem; } }
    #letterText { min-height: 0; white-space: pre-wrap; font: 500 clamp(1rem, 2.2vw, 1.14rem)/1.78 "Playfair Display", serif; }
    /* Thư fit màn hình: chữ co theo chiều cao — màn thấp thì chữ nhỏ lại, hết cảnh kéo lên kéo xuống */
    @media (min-height: 0px) { #letterText { font-size: clamp(.9rem, min(2.2vw, 2vh), 1.05rem); } }
    @media (max-height: 620px) { #letterText { font-size: .88rem; line-height: 1.62; } }
    @media (max-height: 520px) { #letterText { font-size: .82rem; line-height: 1.55; } }
    .signature { margin: 1.4rem 0 0; color: #806039; text-align: right; font: 500 2rem/1 "Great Vibes", cursive; }
    .back { position: absolute; top: 1rem; right: 1rem; border: 0; color: #806039; background: transparent; cursor: pointer; font-size: .8rem; }
    /* Thanh cuộn trong tờ thư: mảnh, mờ, gợn màu giấy */
    .letter::-webkit-scrollbar { width: 5px; }
    .letter::-webkit-scrollbar-thumb { background: #b9905166; border-radius: 99px; }
    .letter::-webkit-scrollbar-track { background: transparent; }
    .opened #musicScreen { opacity: 0; transform: scale(.96); pointer-events: none; }
    .opened #letterScreen { opacity: 1; visibility: visible; transition-delay: 0s; }
    .opened .letter { opacity: 1; transform: translateY(0) rotateX(0); }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 720px) { .music-layout { grid-template-columns: 1fr; gap: 1.1rem; padding: 1.5rem 0 5rem; } .record-caption { margin-top: .85rem; } .words { min-height: 0; padding: 1.3rem 0 0; border-left: 0; border-top: 1px solid #ddb86d99; text-align: center; } .track-progress { margin: 1.1rem auto 0; } .controls { left: 1rem; right: 1rem; justify-content: space-between; } }
    /* Điện thoại dọc: nén thư tối đa — bớt cuộn, chữ vẫn đọc được */
    @media (max-width: 720px) {
      .letter { padding: 2.6rem 1.15rem 1.7rem; }
      .letter-date { margin: 0 0 .8rem; font-size: .66rem; }
      .letter h2 { font-size: 2rem; margin-bottom: .6rem; }
      #letterText { font-size: .84rem; line-height: 1.72; }
      .signature { margin-top: .9rem; font-size: 1.55rem; }
      .back { top: .55rem; right: .7rem; }
    }
    /* Màn dọc nhưng LÙN (điện thoại nhỏ/cửa sổ thấp): thu đĩa + chữ để
     * hàng nút luôn nằm gọn trong màn hình — không bị cắt mất nút */
    @media (max-width: 720px) and (max-height: 700px) {
      .letter { max-height: calc(100svh - 2 * clamp(1rem, 4vw, 3rem) - 1.6rem); }
      .music-layout { gap: .6rem; padding: .8rem 0 4.6rem; }
      .vinyl { width: min(230px, 36vh); }
      .record-glow { width: 60%; }
      .record-caption { margin-top: .5rem; font-size: .62rem; }
      .words { padding-top: .9rem; }
      h1 { margin-bottom: .9rem; font-size: clamp(1.9rem, 6.5vh, 2.6rem); }
      #lyricLine { min-height: 3.2em; font-size: clamp(1rem, 2.7vh, 1.2rem); }
      .controls { bottom: .9rem; }
      .next { padding: .6rem 1.05rem; }
      .letter { padding: 1.6rem 1.4rem; }
      #letterText { min-height: 0; }
    }
    /* Điện thoại dọc nhưng LÙN (<=700px cao): siết thư thêm một nấc cho vừa */
    @media (max-width: 720px) and (max-height: 700px) {
      .letter { padding: 2.4rem 1.05rem 1.4rem; }
      .letter h2 { font-size: 1.8rem; margin-bottom: .45rem; }
      #letterText { font-size: .8rem; line-height: 1.62; }
      .signature { margin-top: .7rem; font-size: 1.4rem; }
      .letter-date { margin-bottom: .6rem; }
    }
    /* Điện thoại XOAY NGANG: gọn lá thư + màn đĩa cho vừa chiều cao */
    @media (orientation: landscape) and (max-height: 520px) {
      .music-layout { gap: clamp(1.5rem, 4vw, 3rem); }
      .vinyl { width: min(240px, 58vh); }
      .record-glow { width: 62%; }
      .record-caption { margin-top: .6rem; font-size: .62rem; }
      h1 { margin-bottom: .8rem; font-size: clamp(1.9rem, 10vh, 3rem); }
      #lyricLine { min-height: 3em; font-size: clamp(1rem, 4.6vh, 1.25rem); }
      .track-progress { margin-top: 1rem; }
      .letter { width: min(640px, 94%); padding: 1.4rem 1.8rem; }
      .letter h2 { margin-bottom: .5rem; font-size: clamp(1.8rem, 12vh, 2.6rem); }
      #letterText { min-height: 0; font-size: clamp(.95rem, 4.2vh, 1.1rem); line-height: 1.65; }
      .signature { margin-top: .9rem; font-size: 1.6rem; }
      .back { top: .6rem; right: .8rem; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main id="musicScreen" class="screen" aria-label="Bài hát kỷ niệm bốn năm">
    <div class="music-layout">
      <div class="record-area">
        <div class="record-glow"></div>
        <div class="vinyl is-paused" id="vinyl" aria-hidden="true">
          <div class="label"><img src="assets/anh-cua-chung-minh.jpg" alt="" onerror="this.remove()" /><span>4<br />năm</span></div>
          <div class="spindle"></div>
        </div>
        <div class="record-caption">Our little record · 2022 — 2026</div>
      </div>
      <section class="words" aria-live="polite">
        <p class="eyebrow">Một bài hát cho chúng mình</p>
        <h1>Như những ngày đầu</h1>
        <p id="lyricLine"></p>
        <div class="track-progress" aria-hidden="true"><span id="progress"></span></div>
      </section>
    </div>
    <div class="controls">
      <button class="music-toggle" id="musicToggle" type="button" aria-pressed="false">♬ Bật nhạc</button>
      <button class="next" id="openLetter" type="button">Mở thư tình ♥</button>
    </div>
    <audio id="bgMusic" loop preload="metadata"><source src="nhac.mp3" type="audio/mpeg" /></audio>
  </main>

  <section id="introScreen" aria-label="Màn mở đầu">
    <div class="intro-box">
      <p class="intro-msg">Chúc em anniversary vui vẻ nhé <span class="intro-heart">♥</span></p>
      <button class="intro-btn" id="introBtn" type="button"><span class="intro-note">♫</span> Mở nhạc</button>
      <p class="intro-hint">Chạm để mở kỷ niệm bốn năm</p>
    </div>
  </section>

  <section id="letterScreen" class="screen" aria-hidden="true" aria-label="Bức thư tình">
    <article class="letter">
      <button class="back" id="backButton" type="button">← Xem lại đĩa than</button>
      <p class="letter-date">Kỷ niệm bốn năm của chúng mình</p>
      <h2>Gửi người thương,</h2>
      <div id="letterText"></div>
      <p class="signature">Thương em rất nhiều ♥</p>
    </article>
  </section>

  <script>
    // Mỗi câu neo tại lúc từ đầu tiên được hát trong nhac.mp3.
    // Đoạn sau 74.5 giây là nhạc dạo nên không hiện lời.
    const syncedLyrics = [
      { at: 13.7, text: "Bốn năm trôi qua" },
      { at: 16.4, text: "Ta vẫn bên nhau" },
      { at: 21.0, text: "Không còn vội vàng như những ngày đầu" },
      { at: 30.2, text: "Anh nhìn em cười và rồi lại nói" },
      { at: 37.6, text: "Ta đã quen nhau như những ngày đầu" },
      { at: 43.6, text: "Vẫn là người ấy" },
      { at: 46.1, text: "Vẫn là bàn tay" },
      { at: 47.3, text: "Nắm thật chặt lấy" },
      { at: 49.2, text: "Dẫu đời đổi thay" },
      { at: 50.9, text: "Đi từng đoạn ngắn" },
      { at: 52.9, text: "Hóa thành đường dài" },
      { at: 54.5, text: "Bước chậm cùng nhau" },
      { at: 56.9, text: "Chẳng cần đến ai" },
      { at: 58.1, text: "Vẫn là ánh mắt" },
      { at: 60.3, text: "Vẫn là môi quen" },
      { at: 61.6, text: "Vẫn gọi tên nhau giữa bao ngàn xem" },
      { at: 65.0, text: "Bao lần ngã xuống" },
      { at: 67.2, text: "Ngẩng đầu nhìn nhau" },
      { at: 68.8, text: "Mình lại yêu thêm như những ngày đầu" },
      { at: 74.5, text: "♪ ..." }
    ];
    const letter = `Thấm thoắt mà chúng mình đã đi cùng nhau bốn năm rồi.

Anh vẫn nhớ cảm giác của những ngày đầu: vừa hồi hộp, vừa vụng về, nhưng chỉ cần có em bên cạnh thì mọi điều đều trở nên dịu dàng. Rồi thời gian đi qua, mình có thêm những câu chuyện, những lần cười thật lâu và cả những ngày không dễ dàng. Cảm ơn em vì đã không buông tay anh trong tất cả những điều đó.

Em vẫn là người anh muốn kể nghe điều nhỏ nhất trong ngày, là bàn tay anh tìm đến khi mỏi mệt, là nơi bình yên mà anh luôn muốn trở về. Bốn năm không làm tình yêu này cũ đi; nó chỉ khiến anh hiểu hơn rằng được yêu em là một điều rất may mắn.

Mong những năm tháng phía trước, chúng mình vẫn chọn nhau — chậm rãi, chân thành, và thương nhau như những ngày đầu tiên.

Yêu em hôm nay, và cả những ngày sau nữa.`;

    const lyricLine = document.querySelector('#lyricLine');
    const progress = document.querySelector('#progress');
    const vinyl = document.querySelector('#vinyl');
    const audio = document.querySelector('#bgMusic');
    const musicToggle = document.querySelector('#musicToggle');
    let activeLyricIndex = -1, lyricFrame, typingTimer;

    function showLyric(index) {
      if (index === activeLyricIndex) return;
      activeLyricIndex = index;
      lyricLine.classList.add('changing');
      lyricLine.textContent = index >= 0 ? syncedLyrics[index].text : "♪ ...";
      requestAnimationFrame(() => {
        lyricLine.classList.remove('changing');
      });
    }
    function syncLyrics() {
      const time = audio.currentTime;
      let index = -1;
      for (let i = 0; i < syncedLyrics.length; i++) {
        if (syncedLyrics[i].at <= time) index = i;
        else break;
      }
      showLyric(index);
      if (Number.isFinite(audio.duration)) progress.style.width = `${Math.min(100, time / audio.duration * 100)}%`;
    }
    function syncWhilePlaying() {
      syncLyrics();
      if (!audio.paused && !audio.ended) lyricFrame = requestAnimationFrame(syncWhilePlaying);
    }
    function startLyricSync() {
      cancelAnimationFrame(lyricFrame);
      syncWhilePlaying();
    }
    audio.addEventListener('play', startLyricSync);
    audio.addEventListener('pause', () => cancelAnimationFrame(lyricFrame));
    audio.addEventListener('timeupdate', syncLyrics);
    audio.addEventListener('seeked', syncLyrics);
    audio.addEventListener('loadedmetadata', syncLyrics);
    syncLyrics();

    /* Rời tab / tắt màn hình: điện thoại tự pause nhạc (tiết kiệm pin) —
       đó KHÔNG phải người dùng bấm dừng. Quay lại tab thì tự phát tiếp
       như cũ, đĩa than và lời bài hát tiếp tục chạy. */
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        if (audio.paused && !window.__userPausedMusic && document.body.classList.contains('intro-done')) playMusic();
        syncLyrics();
      }
    });
    window.addEventListener('pageshow', () => {
      if (audio.paused && !window.__userPausedMusic && document.body.classList.contains('intro-done')) playMusic();
      syncLyrics();
    });

    async function playMusic() {
      try {
        await audio.play();
        musicToggle.textContent = '❚❚ Tạm dừng nhạc';
        musicToggle.setAttribute('aria-pressed', 'true');
        vinyl.classList.remove('is-paused');
        return true;
      } catch {
        musicToggle.textContent = 'Không tìm thấy nhac.mp3';
        return false;
      }
    }
    async function toggleMusic() {
      if (audio.paused) { window.__userPausedMusic = false; await playMusic(); }
      else {
        audio.pause();
        window.__userPausedMusic = true; // người dùng chủ ý tắt — không tự bật lại hộ
        musicToggle.textContent = '♬ Bật nhạc';
        musicToggle.setAttribute('aria-pressed', 'false');
        vinyl.classList.add('is-paused');
      }
    }
    musicToggle.addEventListener('click', toggleMusic);

    // Trình duyệt chỉ cho phép phát âm thanh sau thao tác của người xem.
    // Màn mở đầu chính là thao tác đó: bấm lời chúc / nút Mở nhạc là nhạc vang ngay.
    const introScreen = document.querySelector('#introScreen');
    function openFromIntro() {
      keepScreenAwake();
      playMusic();
      document.body.classList.add('intro-done');
    }
    introScreen.addEventListener('click', openFromIntro, { once: true });

    /* Giữ màn hình luôn sáng khi đang nghe/xem (Wake Lock API).
       Rời tab bị mất khoá → quay lại tự xin lại. Máy không hỗ trợ thì bỏ qua. */
    let wakeLock = null;
    async function keepScreenAwake() {
      try {
        if ('wakeLock' in navigator && !wakeLock) {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', () => { wakeLock = null; });
        }
      } catch (e) { /* không hỗ trợ / bị chặn — im lặng */ }
    }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && document.body.classList.contains('intro-done')) keepScreenAwake();
    });

    /* Nhớ vị trí gõ: đóng thư giữa chừng rồi mở lại sẽ gõ tiếp từ chỗ dừng;
     * gõ xong rồi thì lần mở sau hiện nguyên lá thư luôn, không typing lại. */
    let typePos = 0;
    function typeLetter() {
      const target = document.querySelector('#letterText');
      clearTimeout(typingTimer);
      if (typePos >= letter.length) { target.textContent = letter; return; }
      (function type() { if (typePos < letter.length) { target.textContent = letter.slice(0, ++typePos); typingTimer = setTimeout(type, 18); } })();
    }
    function openLetter() {
      document.body.classList.add('opened');
      document.querySelector('#letterScreen').setAttribute('aria-hidden', 'false');
      setTimeout(typeLetter, 900);
    }
    function closeLetter() {
      document.body.classList.remove('opened');
      document.querySelector('#letterScreen').setAttribute('aria-hidden', 'true');
      clearTimeout(typingTimer);
    }
    document.querySelector('#openLetter').addEventListener('click', openLetter);
    document.querySelector('#backButton').addEventListener('click', closeLetter);
  </script>
</body>
</html>
